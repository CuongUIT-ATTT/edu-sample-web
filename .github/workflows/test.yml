name: CI

on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main, preview]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Integration tests (Vitest) + Playwright dev server đọc DATABASE_URL.
  # dotenv không override env đã set → postgres service local sẽ được dùng.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
  NODE_VERSION: "22"

jobs:
  # ─── Job 1: Lint + Type check (chạy song song với build) ──────────
  quality:
    name: Lint & Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Bắt buộc generate Prisma client trước — nếu không, @prisma/client thiếu type
      # (EventStatus, PrismaClient...) → lint/types báo implicit any + thiếu export.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run test:lint

      - name: Type check
        run: npm run test:types

  # ─── Job 2: Production build (cache .next) ─────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ─── Job 3: Unit + Integration tests (cần Postgres + seed) ─────────
  test:
    name: Unit & Integration
    runs-on: ubuntu-latest
    needs: [quality]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # DB sạch mỗi lần chạy → dùng `db push` (không migrate deploy — repo vốn dùng db-push workflow)
      - name: Push schema + seed
        run: |
          npx prisma db push --skip-generate --accept-data-loss
          npx prisma db seed

      - name: Unit & Integration tests
        run: npm run test:unit

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  # ─── Job 4: E2E Playwright (cần Postgres + seed + build) ───────────
  e2e:
    name: E2E Playwright
    runs-on: ubuntu-latest
    needs: [build, test]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push schema + seed
        run: |
          npx prisma db push --skip-generate --accept-data-loss
          npx prisma db seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # auth.setup đọc TEST_*_EMAIL/PASS. Seed tạo đúng các user này —
      # KHÔNG dùng .env.test (creds cũ không khớp seed). Set trực tiếp.
      - name: E2E tests (production server)
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          TEST_ADMIN_EMAIL: admin@eduweb.vn
          TEST_ADMIN_PASS: hungcuong123
          TEST_TEACHER_EMAIL: toan@eduweb.vn
          TEST_TEACHER_PASS: hungcuong123
          TEST_STUDENT_EMAIL: hs001@email.com
          TEST_STUDENT_PASS: hungcuong123
          TEST_PARENT_EMAIL: parent1@email.com
          TEST_PARENT_PASS: hungcuong123
        run: |
          npm run build
          npx next start &
          # Chờ server sẵn sàng (curl loop, không phụ thuộc gói ngoài)
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000 >/dev/null 2>&1; then break; fi
            sleep 2
          done
          npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright test-results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
